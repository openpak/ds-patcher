name: release

# Tag v1.2.3: host-tests the ROM patch logic, builds the on-console OpenPak DS Patcher (.nds) and
# attaches it to a GitHub Release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update -qq && apt-get install -y -qq g++ python3 >/dev/null && nds/tests/run.sh
      - run: make -C nds APP_VERSION=${GITHUB_REF_NAME#v}
      - run: mkdir -p out && cp nds/OpenPak-DS-Patcher.nds out/
      - uses: actions/upload-artifact@v4
        with:
          name: openpak-ds-patcher
          path: out/*
          retention-days: 3
      - if: startsWith(github.ref, 'refs/tags/v')
        run: (type gh >/dev/null 2>&1 || (mkdir -p /usr/share/keyrings && curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list && apt-get update -qq && apt-get install -y -qq gh >/dev/null)); gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
